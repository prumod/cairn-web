# Future production proposal, not authorized for provisioning.
# Select this file explicitly; root render.yaml never includes production.
# Set an approved non-Free plan before any future production adoption.
services:
  - type: web
    name: cairn-production
    runtime: node
    repo: https://github.com/prumod/cairn-web
    branch: main
    plan: __APPROVED_PRODUCTION_PLAN_REQUIRED__
    region: frankfurt
    buildCommand: >-
      NODE_ENV=development bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: BUN_VERSION
        value: 1.3.14
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
