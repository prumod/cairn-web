name: Deployed company profile E2E

# Run after prerequisites so Render does not wait on this post-deploy gate.
# The privileged workflow checks out only its trusted default-branch revision.
# It never downloads artifacts or checks out the triggering commit.
on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Agent checks]
    branches: [feat/63-company-profile]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: deployed-e2e-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  wait-for-candidate:
    name: Wait for checked testing candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'feat/63-company-profile' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Wait for Render to serve the checked commit
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          CAIRN_TESTING_HEALTH_URL: https://cairn-testing.onrender.com/healthz
        run: node scripts/wait-for-render-revision.mjs

  deployed-e2e:
    name: Run deployed company profile E2E
    needs: wait-for-candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'feat/63-company-profile' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cairn-testing-e2e
      url: https://cairn-testing.onrender.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run deployed Google-authenticated company-profile scenario
        env:
          CAIRN_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          CAIRN_E2E_GOOGLE_CLIENT_ID: ${{ secrets.CAIRN_E2E_GOOGLE_CLIENT_ID }}
          CAIRN_E2E_GOOGLE_CLIENT_SECRET: >-
            ${{ secrets.CAIRN_E2E_GOOGLE_CLIENT_SECRET }}
          CAIRN_E2E_ADMIN_EMAIL: ${{ secrets.CAIRN_E2E_ADMIN_EMAIL }}
          CAIRN_E2E_MEMBER_EMAIL: ${{ secrets.CAIRN_E2E_MEMBER_EMAIL }}
          CAIRN_E2E_ADMIN_REFRESH_TOKEN: >-
            ${{ secrets.CAIRN_E2E_ADMIN_REFRESH_TOKEN }}
          CAIRN_E2E_MEMBER_REFRESH_TOKEN: >-
            ${{ secrets.CAIRN_E2E_MEMBER_REFRESH_TOKEN }}
        run: bun run test:deployed

  publish-result:
    name: Publish candidate E2E status
    needs: [wait-for-candidate, deployed-e2e]
    if: >-
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'feat/63-company-profile' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish final status after deployment and E2E
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RESULT: ${{ needs.wait-for-candidate.result }}
          E2E_RESULT: ${{ needs.deployed-e2e.result }}
        run: |
          TARGET_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$DEPLOY_RESULT" == "success" &&
                "$E2E_RESULT" == "success" ]]; then
            state=success
            description="Deployed company profile E2E passed"
          else
            state=failure
            description="Deployed company profile E2E failed"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" \
            -f context="Deployed company profile E2E" \
            -f description="$description" \
            -f target_url="$TARGET_URL"
