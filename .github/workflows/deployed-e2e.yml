name: Deployed company profile E2E

# Dispatching approves this exact PR head's build/runtime code for testing.
# The app itself receives testing credentials on Render: runner isolation alone
# is not a reason to deploy untrusted PRs. This UNMERGED bootstrap proposal also
# requires explicit review of its immutable runner SHA and a temporary protected
# environment exception. Never merge this branch into main.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Trusted same-repository PR to main
        required: true
        type: string
      candidate_sha:
        description: Full PR head SHA approved for testing
        required: true
        type: string
      reviewed_runner_sha:
        description: Reviewed full runner SHA (bootstrap only)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

# One lock covers deploy, health, authenticated tests, cleanup, and publication.
# Cancellation can leave a pending status; rerun rather than bypass it.
concurrency:
  group: cairn-testing-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate trusted PR candidate on testing
    if: >-
      github.repository == 'prumod/cairn-web' &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/heads/bootstrap/63-reviewed-runner' &&
        inputs.reviewed_runner_sha == github.sha &&
        inputs.pr_number == '79' &&
        inputs.candidate_sha == '7b1687cd39bb45e4a03cef586302fcf96038e06f'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    environment:
      name: cairn-testing-e2e
      url: https://cairn-testing.onrender.com
    env:
      CAIRN_PR_NUMBER: ${{ inputs.pr_number }}
      CAIRN_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CAIRN_REVIEWED_RUNNER_SHA: ${{ inputs.reviewed_runner_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Validate PR, CI, and exclusive testing service
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAIRN_RENDER_API_KEY: ${{ secrets.CAIRN_RENDER_API_KEY }}
        run: node scripts/candidate-gate.mjs prepare
      - name: Deploy approved immutable candidate after CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAIRN_RENDER_API_KEY: ${{ secrets.CAIRN_RENDER_API_KEY }}
          CAIRN_BASE_SHA: ${{ steps.prepare.outputs.base }}
        run: node scripts/candidate-gate.mjs deploy
      - name: Verify the exact live revision
        env:
          DEPLOYED_SHA: ${{ steps.prepare.outputs.sha }}
          CAIRN_TESTING_HEALTH_URL: https://cairn-testing.onrender.com/healthz
        run: node scripts/wait-for-render-revision.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install locked trusted-runner dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run Google-authenticated scenario and cleanup
        id: e2e
        env:
          CAIRN_E2E_GOOGLE_CLIENT_ID: ${{ secrets.CAIRN_E2E_GOOGLE_CLIENT_ID }}
          CAIRN_E2E_GOOGLE_CLIENT_SECRET: >-
            ${{ secrets.CAIRN_E2E_GOOGLE_CLIENT_SECRET }}
          CAIRN_E2E_ADMIN_EMAIL: ${{ secrets.CAIRN_E2E_ADMIN_EMAIL }}
          CAIRN_E2E_MEMBER_EMAIL: ${{ secrets.CAIRN_E2E_MEMBER_EMAIL }}
          CAIRN_E2E_ADMIN_REFRESH_TOKEN: >-
            ${{ secrets.CAIRN_E2E_ADMIN_REFRESH_TOKEN }}
          CAIRN_E2E_MEMBER_REFRESH_TOKEN: >-
            ${{ secrets.CAIRN_E2E_MEMBER_REFRESH_TOKEN }}
        run: bun run test:deployed
      - name: Recheck candidate and publish final E2E status
        if: always() && steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAIRN_RENDER_API_KEY: ${{ secrets.CAIRN_RENDER_API_KEY }}
          CAIRN_BASE_SHA: ${{ steps.prepare.outputs.base }}
          CAIRN_E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: node scripts/candidate-gate.mjs finish
