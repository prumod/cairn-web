name: Deployed company profile E2E

# Trusted main-branch code handles the event; candidate build/runtime code never
# runs on the privileged runner. The gate requires both successful Agent checks
# and a base-branch attestation for this exact same-repository PR head.
# No candidate checkout/artifacts or shell interpolation; Render and test
# secrets remain in trusted main steps only, after head authorization validates.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Agent checks"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

# One lock covers deploy, health, authenticated tests, cleanup, and publication.
# Cancellation can leave a pending status; rerun rather than bypass it.
concurrency:
  group: cairn-testing-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate trusted PR candidate on testing
    if: >-
      github.repository == 'prumod/cairn-web' &&
      github.event.workflow_run.name == 'Agent checks' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name ==
      'prumod/cairn-web' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.event.workflow_run.pull_requests[0].head.sha ==
      github.event.workflow_run.head_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    environment:
      name: cairn-testing-e2e
      url: https://cairn-testing.onrender.com
    env:
      CAIRN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      CAIRN_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      CAIRN_CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Validate PR, trusted submission record, and testing service
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/candidate-gate.mjs prepare
      - name: Deploy the exact trusted candidate after CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAIRN_RENDER_API_KEY: ${{ secrets.CAIRN_RENDER_API_KEY }}
          CAIRN_BASE_SHA: ${{ steps.prepare.outputs.base }}
        run: node scripts/candidate-gate.mjs deploy
      - name: Verify the exact live revision
        env:
          DEPLOYED_SHA: ${{ steps.prepare.outputs.sha }}
          CAIRN_TESTING_HEALTH_URL: https://cairn-testing.onrender.com/healthz
        run: node scripts/wait-for-render-revision.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install locked trusted-runner dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and system dependencies
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run Google-authenticated scenario and cleanup
        id: e2e
        env:
          CAIRN_E2E_GOOGLE_CLIENT_ID: ${{ secrets.CAIRN_E2E_GOOGLE_CLIENT_ID }}
          CAIRN_E2E_GOOGLE_CLIENT_SECRET: >-
            ${{ secrets.CAIRN_E2E_GOOGLE_CLIENT_SECRET }}
          CAIRN_E2E_ADMIN_EMAIL: ${{ secrets.CAIRN_E2E_ADMIN_EMAIL }}
          CAIRN_E2E_MEMBER_EMAIL: ${{ secrets.CAIRN_E2E_MEMBER_EMAIL }}
          CAIRN_E2E_ADMIN_REFRESH_TOKEN: >-
            ${{ secrets.CAIRN_E2E_ADMIN_REFRESH_TOKEN }}
          CAIRN_E2E_MEMBER_REFRESH_TOKEN: >-
            ${{ secrets.CAIRN_E2E_MEMBER_REFRESH_TOKEN }}
        run: bun run test:deployed
      - name: Recheck candidate and publish final E2E status
        if: always() && steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAIRN_RENDER_API_KEY: ${{ secrets.CAIRN_RENDER_API_KEY }}
          CAIRN_BASE_SHA: ${{ steps.prepare.outputs.base }}
          CAIRN_E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: node scripts/candidate-gate.mjs finish
