name: Deploy testing

on:
  workflow_run:
    workflows: [Agent checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-testing
  cancel-in-progress: false

jobs:
  deploy-testing:
    name: Deploy testing
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: testing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Deploy testing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          CI: "true"
        run: bun run --cwd packages/infra deploy:testing --yes
      - name: Verify deployed revision is ready
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          for attempt in {1..40}; do
            : > "$body"
            status=$(curl --silent --max-time 5 --output "$body" --write-out '%{http_code}' \
              https://cairn-testing.prumod.eu/healthz) || status=000
            revision=$(jq -r 'if type == "object" and (.revision | type) == "string" then .revision else "unknown" end' "$body" 2>/dev/null) || revision=unknown
            printf 'HTTP %s revision=%s\n' "$status" "$revision"
            if [[ "$status" == 200 ]] && jq -e --arg sha "$GIT_SHA" \
              '.status == "ready" and .revision == $sha' "$body" >/dev/null 2>&1; then
              exit 0
            fi
            if [[ "$attempt" -lt 40 ]]; then sleep 10; fi
          done
          exit 1
