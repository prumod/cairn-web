name: Record trusted PR submission
run-name: >-
  Trusted PR ${{ github.event.pull_request.number }}
  at ${{ github.event.pull_request.head.sha }}

# This workflow runs trusted base-branch code only. It records which account
# opened or pushed the exact PR revision; it never checks out or runs that code.
# The sole write is an exact-head status guarded by actor ID; event data is
# validated in Node, not interpolated into shell commands. No secrets are used.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize]

permissions: {}

jobs:
  record:
    if: >-
      github.actor_id == '99197066' &&
      github.repository == 'prumod/cairn-web' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Attest the trusted exact PR head without executing it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          CAIRN_PR_NUMBER: ${{ github.event.pull_request.number }}
          CAIRN_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/candidate-gate.mjs attest
