# Existing test service only; review the adoption guide before syncing.
services:
  - type: web
    name: cairn-testing
    runtime: node
    repo: https://github.com/prumod/cairn-web
    branch: feat/63-company-profile
    plan: free
    region: frankfurt
    buildCommand: >-
      NODE_ENV=development bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: BUN_VERSION
        value: 1.3.14
      - key: APP_ORIGIN
        value: https://cairn-testing.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
