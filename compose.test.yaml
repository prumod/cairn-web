services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
  neon:
    image: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
    environment:
      PG_CONNECTION_STRING: postgres://postgres:local-test-only@postgres:5432/postgres
    ports:
      - "127.0.0.1::4444"
    depends_on:
      postgres:
        condition: service_healthy
